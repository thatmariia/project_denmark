[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-denmark"
version = "v0.1.0"
description = "Short description of our project"
readme = "README.md"
requires-python = ">=3.14"
license-files = ["LICENSE"]
authors = [
  { name = "Mariia Steeghs-Turchina" }]
dependencies = ["typer"]
keywords = ["my keyword", "Data mining"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
test = ["pytest"]
quality = ["pre-commit", "ruff", "mypy"]
release = [
  "build",
  "packaging",
  "twine",
]
docs = ["zensical", "mkdocstrings[python]"]

[project.scripts]
"project-denmark" = "project_denmark.adapters.cli.app:main"

[project.urls]
"Source Code" = "https://github.com/thatmariia/project_denmark"
Documentation = "https://thatmariia.github.io/project_denmark/"
Changelog = "https://github.com/thatmariia/project_denmark/blob/HEAD/CHANGELOG.md"
Download = "https://pypi.org/project/project-denmark/#files"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "typer.*",
]
ignore_missing_imports = true
